<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Feed</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #626a77; --line: #e2e5ea;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --good: #1f7a4d; --good-soft: #e3f4ea;
  --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #a23b3b; --chip: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa2ae; --line: #2a2e36;
    --accent: #7d9cf0; --accent-soft: #1f2840; --good: #5cc28b; --good-soft: #17301f;
    --warn: #e0a64a; --warn-soft: #33270f; --bad: #e07b7b; --chip: #242830;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; }
.bar { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input[type=search] { background: var(--card); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 14px; }
input[type=search] { flex: 1 1 180px; min-width: 0; }
.tabs { max-width: 980px; margin: 0 auto; padding: 4px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; }
.tab.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
main { max-width: 980px; margin: 0 auto; padding: 10px 16px 40px; display: grid; gap: 10px; }
.job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.job.new { border-left: 4px solid var(--accent); }
.top { display: flex; gap: 10px; align-items: flex-start; }
.score { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 700; font-size: 15px; background: var(--chip); }
.score.hi { background: var(--good-soft); color: var(--good); }
.score.mid { background: var(--warn-soft); color: var(--warn); }
.ttl { font-weight: 650; font-size: 16px; color: var(--text); text-decoration: none; }
.ttl:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { background: var(--chip); border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted); }
.chip.visa { background: var(--good-soft); color: var(--good); }
.why { margin: 8px 0 0; font-size: 14px; }
.acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.acts button, .acts a { font: inherit; font-size: 13px; border-radius: 8px; padding: 5px 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
.acts a.open { background: var(--accent); border-color: var(--accent); color: #fff; }
.acts button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>Job Feed</h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Search title, company, skill…">
  <select id="region"><option value="">All regions</option></select>
  <select id="family"><option value="">All role types</option></select>
  <select id="minscore">
    <option value="0">Any score</option><option value="60">60+</option>
    <option value="70" selected>70+</option><option value="80">80+</option>
  </select>
  <span class="count" id="count"></span>
</div>
<main id="list"></main>

<script>
const KEY = 'jobfeed-status-v1', SEEN = 'jobfeed-lastvisit-v1';
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let jobs = [], status = store.get(KEY, {}), tab = 'open';
const lastVisit = store.get(SEEN, null);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

function fill(sel, values) {
  [...new Set(values.filter(Boolean))].sort().forEach(v => sel.insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`));
}
function renderTabs() {
  const n = s => jobs.filter(j => (status[j.id] || 'open') === s).length;
  const defs = [['open', 'To review'], ['saved', 'Saved'], ['applied', 'Applied'], ['hidden', 'Not interested']];
  $('tabs').innerHTML = defs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-t="${k}">${l} (${n(k)})</button>`).join('');
}
function render() {
  renderTabs();
  const q = $('q').value.toLowerCase(), r = $('region').value, f = $('family').value, m = +$('minscore').value;
  const list = jobs.filter(j => (status[j.id] || 'open') === tab)
    .filter(j => !r || j.region === r).filter(j => !f || j.role_family === f)
    .filter(j => (j.score || 0) >= m)
    .filter(j => !q || [j.title, j.company, j.location, j.why, (j.skills || []).join(' ')].join(' ').toLowerCase().includes(q));
  $('count').textContent = `${list.length} shown`;
  if (!list.length) { $('list').innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  $('list').innerHTML = list.map(j => {
    const cls = j.score >= 80 ? 'hi' : j.score >= 65 ? 'mid' : '';
    const isNew = lastVisit && j.found_at > lastVisit;
    const st = status[j.id] || 'open';
    return `<article class="job ${isNew ? 'new' : ''}">
      <div class="top">
        <div class="score ${cls}">${esc(j.score)}</div>
        <div>
          <a class="ttl" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">${esc(j.title)}</a>
          <div class="meta">${esc(j.company)} · ${esc(j.location)}${j.posted ? ' · posted ' + esc(j.posted) : ''} · found ${esc((j.found_at || '').slice(0, 10))}</div>
        </div>
      </div>
      <div class="chips">
        <span class="chip">${esc(j.region)}</span><span class="chip">${esc(j.role_family)}</span>
        ${j.visa ? `<span class="chip visa">${esc(j.visa)}</span>` : ''}
        ${j.salary ? `<span class="chip">${esc(j.salary)}</span>` : ''}
        ${j.source ? `<span class="chip">${esc(j.source)}</span>` : ''}
      </div>
      <p class="why">${esc(j.why)}</p>
      <div class="acts">
        <a class="open" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">Open job</a>
        ${['saved', 'applied', 'hidden'].map(s => `<button data-id="${esc(j.id)}" data-s="${s}" class="${st === s ? 'on' : ''}">${{saved: 'Save', applied: 'Applied', hidden: 'Not interested'}[s]}</button>`).join('')}
        ${st !== 'open' ? `<button data-id="${esc(j.id)}" data-s="open">Move back</button>` : ''}
      </div>
    </article>`;
  }).join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { tab = t.dataset.t; render(); return; }
  const b = e.target.closest('button[data-id]');
  if (b) { status[b.dataset.id] = b.dataset.s; store.set(KEY, status); render(); }
});
['q', 'region', 'family', 'minscore'].forEach(id => $(id).addEventListener('input', render));

fetch('jobs.json?t=' + Date.now()).then(r => r.json()).then(d => {
  jobs = (d.jobs || []).sort((a, b) => (b.found_at || '').localeCompare(a.found_at || '') || (b.score || 0) - (a.score || 0));
  const fresh = lastVisit ? jobs.filter(j => j.found_at > lastVisit).length : 0;
  $('updated').textContent = `Last checked ${d.updated ? new Date(d.updated).toLocaleString() : 'never'} · ${jobs.length} jobs total` + (fresh ? ` · ${fresh} new since your last visit` : '');
  fill($('region'), jobs.map(j => j.region)); fill($('family'), jobs.map(j => j.role_family));
  render();
  store.set(SEEN, new Date().toISOString());
}).catch(() => { $('updated').textContent = 'Could not load jobs.json'; });
</script>
</body>
</html>
